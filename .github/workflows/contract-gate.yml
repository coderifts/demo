name: contract-gate

on:
  pull_request:
  schedule:
    # Daily 06:17 UTC — arbitrary offset to avoid :00 stampedes.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  contract-gate-action:
    name: contract-gate (Action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: coderifts/contract-gate@58c72554160e1154ad1864400487d13b89ac3cf9
        with:
          api-key: ${{ secrets.CODERIFTS_API_KEY }}
          post-check-run: "false"
