# The PR job runs the pinned gate action; schedule and dispatch run the keyless canary loop.

name: contract-gate

on:
  pull_request:
  schedule:
    # Daily 06:17 UTC — arbitrary offset to avoid :00 stampedes.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  contract-gate-action:
    name: contract-gate (Action)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: coderifts/contract-gate@58c72554160e1154ad1864400487d13b89ac3cf9
        with:
          api-key: ${{ secrets.CODERIFTS_API_KEY }}
          post-check-run: "false"

  canary:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: analyze canary — a break is detected and nothing is authorized
        run: |
          curl -sS https://coderifts.com/examples/description-drift.json \
            | curl -sS https://app.coderifts.com/api/v1/preflight -H 'Content-Type: application/json' -d @- \
            | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          assert d.get("analysis_outcome") == "BREAKS_DETECTED", d
          assert d.get("may_execute") is False, d
          assert d.get("authorization_effect") == "NONE", d
          print("canary: BREAKS_DETECTED / may_execute:false / authorization_effect:NONE")
          '
      - name: unknown method is refused, by name
        run: |
          curl -sS -X POST https://app.coderifts.com/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"server/discover"}' | grep -q '\-32601' \
            && echo "canary: -32601 named refusal"
